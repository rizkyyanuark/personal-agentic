map $http_upgrade $personal_agentic_upgrade_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.tugasakhir.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://agent.tugasakhir.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.tugasakhir.space;

    ssl_certificate /etc/letsencrypt/live/agent.tugasakhir.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.tugasakhir.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $personal_agentic_upgrade_connection;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
