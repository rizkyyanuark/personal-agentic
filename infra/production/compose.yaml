name: personal-agentic-prod

services:
  platform:
    image: ${AE_PLATFORM_IMAGE:?Set the tested platform image digest}
    platform: linux/arm64
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:18766:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AE_PUBLIC_URL: "${AE_PUBLIC_URL:?Set the production HTTPS origin}"
      AE_INTERNAL_URL: "http://platform:8765"
      AE_MATRIX_HOMESERVER: "http://matrix:8008"
      AE_MATRIX_BOT_USERNAME: "${AE_MATRIX_BOT_USERNAME:-agentic}"
      AE_MATRIX_BOT_PASSWORD: "${AE_MATRIX_BOT_PASSWORD:?Set the production Matrix bridge password}"
    volumes:
      - platform-data:/data
      - platform-workdir:/workdir
      - type: bind
        source: ${AE_SSH_KEY_FILE:?Set the dedicated production runtime key path}
        target: /run/ae-ssh/id_ed25519
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - matrix

  matrix:
    image: ghcr.io/element-hq/synapse:v1.161.0
    platform: linux/arm64
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 1g
    ports:
      - "127.0.0.1:18767:8008"
    environment:
      SYNAPSE_SERVER_NAME: "${AE_MATRIX_SERVER_NAME:?Set a stable production Matrix server name}"
      SYNAPSE_REPORT_STATS: "no"
      AE_MATRIX_BOT_USERNAME: "${AE_MATRIX_BOT_USERNAME:-agentic}"
      AE_MATRIX_BOT_PASSWORD: "${AE_MATRIX_BOT_PASSWORD:?Set the production Matrix bridge password}"
    volumes:
      - matrix-data:/data

volumes:
  platform-data:
  platform-workdir:
  matrix-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.76.0/24
