[[runners]]
  executor = "docker"
  limit = 1
  request_concurrency = 1

  [runners.feature_flags]
    FF_NETWORK_PER_BUILD = true

  [runners.docker]
    image = "moby/buildkit@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855"
    user = "1000:1000"
    privileged = false
    services_privileged = false
    services_limit = 0
    volumes = ["/cache"]
    memory = "1g"
    memory_swap = "2g"
    cpus = "1"
    cpu_shares = 256
    oom_score_adjust = 500
    shm_size = 268435456
    pull_policy = "always"
    allowed_pull_policies = ["always"]
    allowed_images = ["moby/buildkit@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855"]
    security_opt = ["seccomp=/etc/gitlab-runner/security/buildkit-seccomp.json", "apparmor=personal-agentic-buildkit"]
