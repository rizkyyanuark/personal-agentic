workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - preflight
  - verify
  - image
  - smoke
  - deploy

default:
  tags:
    - personal-agentic-ci
  interruptible: true

variables:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  RUST_MIN_STACK: "67108864"
  CARGO_BUILD_JOBS: "1"

frontend:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - cd src
    - npm ci --no-audit --no-fund
    - npm run check
    - node --experimental-strip-types --test frontend/tests/cockpit-workspace.test.mjs
    - mkdir -p ci-artifacts
    - cp -a frontend/dist ci-artifacts/frontend
  artifacts:
    expire_in: 7 days
    paths:
      - src/ci-artifacts/frontend/

backend:
  stage: verify
  timeout: 2h
  image: rust:1.94-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev clang lld cmake libssl-dev pkg-config xz-utils
    - protoc --version
    - |
      cat > /usr/local/bin/cc <<'SH'
      #!/bin/sh
      exec /usr/bin/cc -fuse-ld=lld "$@"
      SH
      chmod +x /usr/local/bin/cc
      command -v cc
      printf 'int main(void) { return 0; }\n' | cc -x c - -o /tmp/ci-linker-check
      readelf --string-dump .comment /tmp/ci-linker-check
    - rustup component add rustfmt
    - bash src/scripts/install-onnx.sh /usr/local/lib
    - ldconfig
  variables:
    PROTOC: /usr/bin/protoc
    ORT_DYLIB_PATH: /usr/local/lib/libonnxruntime.so
    CARGO_HOME: /cache/cargo
    CARGO_TARGET_DIR: /cache/target/rust-1.94-arm64
  script:
    - cd src
    - cargo fmt --all --check
    - cargo test --workspace --locked --verbose
    - cargo build --locked --bin agentic-enterprise --verbose
    - mkdir -p ci-artifacts
    - strip --strip-unneeded -o ci-artifacts/agentic-enterprise "$CARGO_TARGET_DIR/debug/agentic-enterprise"
    - chmod 755 ci-artifacts/agentic-enterprise
    - xz -6 -T1 ci-artifacts/agentic-enterprise
    - du -h ci-artifacts/agentic-enterprise.xz
  artifacts:
    expire_in: 7 days
    paths:
      - src/ci-artifacts/agentic-enterprise.xz

registry_auth:
  stage: preflight
  image: node:22-bookworm-slim
  script:
    - node infra/ci/registry-check.mjs

ssh_bridge:
  stage: verify
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python src/backend/tests/antigravity_skills.py

production_config:
  stage: verify
  image: python:3.11-slim
  script:
    - python -c "import ast, pathlib; ast.parse(pathlib.Path('infra/production/release.py').read_text())"
    - bash -n infra/production/bootstrap.sh
    - sh -n infra/production/deploy-command.sh

.image_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/dev-prod-integration"'
      when: manual
      allow_failure: false

image_publish:
  extends: .image_rules
  stage: image
  tags:
    - personal-agentic-image
  image:
    name: moby/buildkit@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  timeout: 45m
  resource_group: arm64-image
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --oci-worker-snapshotter=native --oci-worker-binary /tmp/personal-agentic-runc --config /tmp/personal-agentic-buildkit.toml
  script:
    - |
      set -eu
      umask 077
      test "$(uname -m)" = aarch64
      test "$(id -u)" = 1000
      xz -dc src/ci-artifacts/agentic-enterprise.xz > src/ci-artifacts/agentic-enterprise
      chmod 755 src/ci-artifacts/agentic-enterprise
      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      case "$CI_REGISTRY_IMAGE" in
        "$CI_REGISTRY"/*) : ;;
        *) echo 'CI registry image does not belong to the registry' >&2; exit 1 ;;
      esac
      registry_host="${CI_REGISTRY%:443}"
      registry_image="$registry_host/${CI_REGISTRY_IMAGE#"$CI_REGISTRY/"}"
      registry_auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$registry_host" "$registry_auth" > "$DOCKER_CONFIG/config.json"
      unset registry_auth
      cat > /tmp/personal-agentic-runc <<'SH'
      #!/bin/sh
      set -eu
      remaining=$#
      awaiting_value=0
      seen_command=0
      while [ "$remaining" -gt 0 ]; do
        argument=$1
        shift
        insert=0
        if [ "$seen_command" -eq 0 ]; then
          if [ "$awaiting_value" -eq 1 ]; then
            awaiting_value=0
          else
            case "$argument" in
              --root|--log|--log-format|--rootless) awaiting_value=1 ;;
              -*) : ;;
              run|create) seen_command=1; insert=1 ;;
              *) seen_command=1 ;;
            esac
          fi
        fi
        set -- "$@" "$argument"
        if [ "$insert" -eq 1 ]; then
          set -- "$@" --no-new-keyring
        fi
        remaining=$((remaining - 1))
      done
      exec /usr/bin/buildkit-runc "$@"
      SH
      chmod 755 /tmp/personal-agentic-runc
      printf '[worker.oci]\nmax-parallelism = 1\n' > /tmp/personal-agentic-buildkit.toml
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=src --local dockerfile=src \
        --opt target=platform --opt platform=linux/arm64 \
        --opt build-arg:FRONTEND_SOURCE=frontend-ci \
        --opt build-arg:BACKEND_SOURCE=backend-ci \
        --opt label:org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --opt label:org.opencontainers.image.source="$CI_PROJECT_URL" \
        --import-cache type=registry,ref="$registry_image/cache:$CI_COMMIT_REF_SLUG" \
        --export-cache type=registry,ref="$registry_image/cache:$CI_COMMIT_REF_SLUG",mode=min \
        --output type=image,name="$registry_image/platform:$CI_COMMIT_SHA",push=true \
        --metadata-file image-metadata.json
      image_digest=$(sed -n 's/.*"containerimage.digest": "\(sha256:[0-9a-f]\{64\}\)".*/\1/p' image-metadata.json)
      test "${#image_digest}" = 71
      svg_digest=$(sha256sum src/frontend/public/harnesses/antigravity.svg | cut -d ' ' -f 1)
      printf 'TESTED_IMAGE=%s/platform@%s\nSMOKE_EXPECTED_AGY_SHA256=%s\n' "$CI_REGISTRY_IMAGE" "$image_digest" "$svg_digest" > image.env
      printf 'Published ARM64 image: %s/platform@%s\n' "$CI_REGISTRY_IMAGE" "$image_digest"
  artifacts:
    expire_in: 7 days
    paths:
      - image-metadata.json
      - image.env
    reports:
      dotenv: image.env

image_smoke:
  stage: smoke
  image:
    name: $TESTED_IMAGE
    entrypoint: [""]
  needs:
    - job: image_publish
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/dev-prod-integration"'
  timeout: 10m
  script:
    - bash infra/ci/smoke-image.sh > image-smoke.json
    - cat image-smoke.json
  artifacts:
    expire_in: 7 days
    paths:
      - image-smoke.json

deploy_production:
  stage: deploy
  image: python:3.11-slim
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://agent.tugasakhir.space
  needs:
    - job: image_publish
      artifacts: true
    - job: image_smoke
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  timeout: 20m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openssh-client ca-certificates curl
  script:
    - |
      set -eu
      test -f "$PROD_SSH_PRIVATE_KEY"
      test -f "$PROD_SSH_KNOWN_HOSTS"
      chmod 600 "$PROD_SSH_PRIVATE_KEY" "$PROD_SSH_KNOWN_HOSTS"
      python - <<'PY' > release-request.json
      import json, os, re
      image = os.environ["TESTED_IMAGE"]
      match = re.fullmatch(r"registry\.tugasakhir\.space(?::443)?/rizkyyanuark/personal-agentic/platform@(sha256:[0-9a-f]{64})", image)
      if not match:
          raise SystemExit("The tested image must belong to this production repository")
      print(json.dumps({"action": "promote", "digest": match[1],
                        "commit": os.environ["CI_COMMIT_SHA"],
                        "svg_sha256": os.environ["SMOKE_EXPECTED_AGY_SHA256"]}))
      PY
      ssh -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROD_SSH_KNOWN_HOSTS" \
        -i "$PROD_SSH_PRIVATE_KEY" personal-agentic-deploy@172.31.7.134 release \
        < release-request.json > production-release.json
      cat production-release.json
      curl --fail --silent --show-error --max-time 20 https://agent.tugasakhir.space/api/health > production-health.json
      python - <<'PY'
      import json
      with open("production-health.json") as source:
          if json.load(source).get("status") != "ok":
              raise SystemExit("Public production health did not confirm readiness")
      PY
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - production-release.json
      - production-health.json
