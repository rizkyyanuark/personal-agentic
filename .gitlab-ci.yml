workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

default:
  tags:
    - personal-agentic-ci
  interruptible: true

variables:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  RUST_MIN_STACK: "67108864"
  CARGO_BUILD_JOBS: "2"

frontend:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - cd src
    - npm ci --no-audit --no-fund
    - npm run check
    - node --experimental-strip-types --test frontend/tests/cockpit-workspace.test.mjs

backend:
  stage: verify
  image: rust:1.94-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev clang cmake libssl-dev pkg-config
    - rustup component add rustfmt
    - bash src/scripts/install-onnx.sh /usr/local/lib
    - ldconfig
  variables:
    ORT_DYLIB_PATH: /usr/local/lib/libonnxruntime.so
  script:
    - cd src
    - cargo fmt --all --check
    - cargo test --workspace --locked

ssh_bridge:
  stage: verify
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python src/backend/tests/antigravity_skills.py
