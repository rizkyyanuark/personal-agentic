workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - image
  - smoke
  - deploy

default:
  tags:
    - personal-agentic-ci
  interruptible: true

variables:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  RUST_MIN_STACK: "67108864"
  CARGO_BUILD_JOBS: "1"

frontend:
  stage: verify
  image: node:22-bookworm-slim
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
        node infra/ci/registry-check.mjs
      fi
    - cd src
    - npm ci --no-audit --no-fund
    - npm run check
    - node --experimental-strip-types --test frontend/tests/cockpit-workspace.test.mjs
    - mkdir -p ci-artifacts
    - cp -a frontend/dist ci-artifacts/frontend
  artifacts:
    expire_in: 7 days
    paths:
      - src/ci-artifacts/frontend/

backend:
  stage: verify
  timeout: 2h
  image: rust:1.94-bookworm
  variables:
    PROTOC: /usr/bin/protoc
    ORT_DYLIB_PATH: /usr/local/lib/libonnxruntime.so
    CARGO_HOME: /cache/cargo
    CARGO_TARGET_DIR: /cache/target/rust-1.94-arm64
  script:
    - bash infra/ci/build-backend.sh
  artifacts:
    expire_in: 7 days
    paths:
      - src/ci-artifacts/agentic-enterprise.xz

ssh_bridge:
  stage: verify
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python src/backend/tests/antigravity_skills.py
    - python src/backend/tests/run_documents.py
    - python -B src/backend/tests/process_ownership.py

production_config:
  stage: verify
  image: python:3.11-slim
  script:
    - python -B infra/production/tests/release_test.py
    - python -B infra/ci/tests/deploy_test.py
    - python -B infra/ops/tests/maintenance_test.py
    - python -B infra/ops/tests/measure_test.py
    - bash -n infra/production/bootstrap.sh infra/ci/build-backend.sh infra/ci/smoke-image.sh
    - sh -n infra/production/deploy-command.sh infra/ci/buildkit-runc.sh infra/ci/publish-image.sh
  
.image_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'

image_publish:
  extends: .image_rules
  stage: image
  tags:
    - personal-agentic-image
  image:
    name: moby/buildkit@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  timeout: 45m
  resource_group: arm64-image
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --oci-worker-snapshotter=native --oci-worker-binary /tmp/personal-agentic-runc --config /tmp/personal-agentic-buildkit.toml
  script:
    - sh infra/ci/publish-image.sh
  artifacts:
    expire_in: 7 days
    paths:
      - image-metadata.json
      - image.env
    reports:
      dotenv: image.env

image_smoke:
  stage: smoke
  image:
    name: $TESTED_IMAGE
    entrypoint: [""]
  needs:
    - job: image_publish
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  timeout: 10m
  script:
    - bash infra/ci/smoke-image.sh > image-smoke.json
    - cat image-smoke.json
  artifacts:
    expire_in: 7 days
    paths:
      - image-smoke.json

deploy_production:
  stage: deploy
  image: python:3.11-slim
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://agent.tugasakhir.space
  needs:
    - job: image_publish
      artifacts: true
    - job: image_smoke
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  timeout: 90m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openssh-client ca-certificates git
  script:
    - python -B infra/ci/deploy.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - production-release.json
      - production-health.json
